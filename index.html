<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Stadium Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>⚾ MLB Stadium Tracker</h1>
    <p class="subtitle">Track every ballpark you've been to.</p>
    <nav class="view-nav">
      <a class="active" href="index.html">List</a>
      <a href="collection.html">Collection</a>
      <a href="former.html">Former Parks</a>
    </nav>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <span id="progressText" class="progress-text">0 / 30 visited</span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search team, stadium, or city..." autocomplete="off">
      <div class="filters">
        <select id="leagueFilter">
          <option value="">All Leagues</option>
          <option value="AL">American League</option>
          <option value="NL">National League</option>
        </select>
        <select id="visitedFilter">
          <option value="">All Stadiums</option>
          <option value="visited">Visited</option>
          <option value="unvisited">Not Visited</option>
        </select>
        <select id="sortBy">
          <option value="division">Sort: Division</option>
          <option value="team">Sort: Team Name</option>
          <option value="visited">Sort: Visited First</option>
        </select>
      </div>
      <div class="io-buttons">
        <button id="exportBtn" title="Save your data to a JSON file">Export</button>
        <button id="importBtn" title="Load data from a JSON file">Import</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <footer>
    <p>Your data is stored locally in this browser only. Use Export to back it up or move it to another device.</p>
  </footer>

  <script src="stadiums.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
