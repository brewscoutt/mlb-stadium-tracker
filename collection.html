<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Stadium Tracker &mdash; Collection</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="collection.css">
</head>
<body>
  <header class="app-header">
    <h1>⚾ Stadium Collection</h1>
    <p class="subtitle">Tap a badge to check off a stadium. Collect them all.</p>
    <nav class="view-nav">
      <a href="index.html">List</a>
      <a class="active" href="collection.html">Collection</a>
      <a href="former.html">Former Parks</a>
    </nav>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <span id="progressText" class="progress-text">0 / 30 visited</span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search team, stadium, or city..." autocomplete="off">
      <div class="filters">
        <select id="leagueFilter">
          <option value="">All Leagues</option>
          <option value="AL">American League</option>
          <option value="NL">National League</option>
        </select>
        <select id="visitedFilter">
          <option value="">All Stadiums</option>
          <option value="visited">Visited</option>
          <option value="unvisited">Not Visited</option>
        </select>
      </div>
    </div>

    <div id="badgeGrid" class="badge-grid"></div>
  </main>

  <footer>
    <p>Your data is stored locally in this browser only. Use the List view to export a backup.</p>
  </footer>

  <script src="stadiums.js"></script>
  <script src="storage.js"></script>
  <script src="pixel-stadium.js"></script>
  <script src="collection.js"></script>
</body>
</html>
